<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AP1 交互式2D分形 Sierpinski垫片</title>
    <style>
        canvas {border:1px solid black;}
        .panel {margin-bottom:8px;}
    </style>
</head>
<body>
<div class="panel">
    <h4>控制面板</h4>
    <div>
        最大点数(混沌游戏):<input type="range" id="pointCount" min="1000" max="20000" value="8000">
        <span id="pointCountVal">8000</span>
    </div>
    <div>
        递归深度(细分模式):<input type="range" id="depthSlider" min="0" max="6" value="3">
        <span id="depthVal">3</span>
    </div>
    <div>
        点大小:<input type="range" id="pointSize" min="1" max="8" value="2">
    </div>
    <div>
        配色方案:
        <select id="colorScheme">
            <option value="0">方案1 黑白</option>
            <option value="1">方案2 蓝紫</option>
            <option value="2">方案3 青橙</option>
        </select>
    </div>
    <div>
        渲染模式：
        <button id="modePoints">1-点云POINTS</button>
        <button id="modeLines">2-线框LINES</button>
        <button id="modeTriangles">3-实体TRIANGLES</button>
    </div>
    <div>提示键盘：1/2/3切换模式；空格暂停动画；鼠标左键拖拽平移；滚轮缩放</div>
</div>

<canvas id="glcanvas" width="600" height="600"></canvas>

<!-- 教材common库 -->
<script src="Common/webgl-utils.js"></script>
<script src="Common/initShaders.js"></script>
<script src="Common/MV.js"></script>

<script type="module" src="shaders.js"></script>
<script type="module" src="fractal.js"></script>
<script type="module" src="ui.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>
